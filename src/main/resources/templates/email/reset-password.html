<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('Restablece tu contraseña', ~{::content})}">
<body>
<div th:fragment="content" style="font-size:15px;line-height:1.6;">
    <p>Hola <strong th:text="${name}">usuario</strong>,</p>
    <p>Recibimos una solicitud para restablecer la contraseña de tu cuenta.</p>
    <p style="margin:24px 0;">
        <a th:href="${link}"
           style="background-color:#3f76ff;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">
            Restablecer contraseña
        </a>
    </p>
    <p style="color:#6b7280;font-size:13px;">
        El enlace vence en <span th:text="${minutes}">60</span> minutos y solo se puede usar una vez.
        Si no lo pediste, ignora este correo: tu contraseña no cambiará.
    </p>
</div>
</body>
</html>
