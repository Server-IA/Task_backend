<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout(#{reset.meta}, #{reset.preheader}, ~{::content})}">
<body>
<div th:fragment="content">
    <div th:replace="~{email/parts :: heading('•••', 'accent', #{reset.title})}"></div>
    <p class="tf-muted" style="margin:12px 0 0;color:#67615A;">
        <th:block th:text="#{greeting}">Hola</th:block> <strong class="tf-ink" style="color:#23201B;" th:text="${name}">Ana</strong><th:block th:text="#{reset.intro}">, recibimos una solicitud
        para restablecer la contraseña de tu cuenta. Crea una nueva desde este enlace.</th:block>
    </p>
    <div th:replace="~{email/parts :: button(${link}, #{reset.button}, #{reset.expires(${minutes})})}"></div>
    <div th:replace="~{email/parts :: footnote(#{reset.footnote}, ${link})}"></div>
</div>
</body>
</html>
