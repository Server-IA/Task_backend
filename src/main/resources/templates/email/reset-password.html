<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('~/correo/restablecer', 'Crea una nueva contraseña para tu cuenta de TaskFlow.', ~{::content})}">
<body>
<div th:fragment="content">
    <div th:replace="~{email/parts :: heading('•••', 'accent', 'Restablece tu contraseña')}"></div>
    <p class="tf-muted" style="margin:12px 0 0;color:#67615A;">
        Hola <strong class="tf-ink" style="color:#23201B;" th:text="${name}">Ana</strong>, recibimos una solicitud
        para restablecer la contraseña de tu cuenta. Crea una nueva desde este enlace.
    </p>
    <div th:replace="~{email/parts :: button(${link}, 'Crear nueva contraseña', |vence en ${minutes} min · solo sirve una vez|)}"></div>
    <div th:replace="~{email/parts :: footnote('Si no lo pediste, ignora este correo: tu contraseña no cambiará.', ${link})}"></div>
</div>
</body>
</html>
