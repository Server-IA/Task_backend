<!DOCTYPE html>
<!--/* Plantilla base de los correos: cada correo reemplaza el título y el contenido */-->
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:fragment="layout(heading, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7;padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px;background-color:#ffffff;border-radius:8px;overflow:hidden;">
                <tr>
                    <td style="background-color:#3f76ff;padding:20px 32px;color:#ffffff;font-size:20px;font-weight:bold;">
                        TaskFlow
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px;">
                        <h1 style="margin:0 0 16px;font-size:20px;" th:text="${heading}">Título</h1>
                        <div style="font-size:15px;line-height:1.6;" th:replace="${content}">Contenido</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px;background-color:#f9fafb;color:#6b7280;font-size:12px;">
                        Recibiste este correo porque tienes una cuenta en TaskFlow o alguien te invitó.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
