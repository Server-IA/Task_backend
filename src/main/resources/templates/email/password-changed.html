<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('Tu contraseña cambió', ~{::content})}">
<body>
<div th:fragment="content" style="font-size:15px;line-height:1.6;">
    <p>Hola <strong th:text="${name}">usuario</strong>,</p>
    <p>La contraseña de tu cuenta se cambió el <span th:text="${date}">1 de enero de 2026</span>.
        Por seguridad, cerramos las demás sesiones abiertas.</p>
    <p>
        <strong>¿No fuiste tú?</strong>
        <a th:href="${link}" style="color:#3f76ff;">Recupera el acceso a tu cuenta</a> cuanto antes.
    </p>
</div>
</body>
</html>
