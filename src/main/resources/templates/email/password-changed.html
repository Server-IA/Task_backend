<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout(#{security.meta}, #{changed.preheader}, ~{::content})}">
<body>
<div th:fragment="content">
    <div th:replace="~{email/parts :: heading('✓', 'ok', #{changed.title})}"></div>
    <p class="tf-muted" style="margin:12px 0 0;color:#67615A;">
        <th:block th:text="#{greeting}">Hola</th:block> <strong class="tf-ink" style="color:#23201B;" th:text="${name}">Ana</strong><th:block th:text="#{changed.intro}">, la contraseña de tu cuenta
        se cambió el</th:block> <strong class="tf-ink" style="color:#23201B;" th:text="${date}">1 de enero de 2026, 10:00 a. m.</strong><th:block th:text="#{changed.outro}">
        Por seguridad, cerramos las demás sesiones abiertas.</th:block>
    </p>
    <div th:replace="~{email/parts :: notYou(${link}, #{changed.action})}"></div>
</div>
</body>
</html>
