<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('~/correo/seguridad', 'La contraseña de tu cuenta de TaskFlow se cambió.', ~{::content})}">
<body>
<div th:fragment="content">
    <div th:replace="~{email/parts :: heading('✓', 'ok', 'Tu contraseña cambió')}"></div>
    <p class="tf-muted" style="margin:12px 0 0;color:#67615A;">
        Hola <strong class="tf-ink" style="color:#23201B;" th:text="${name}">Ana</strong>, la contraseña de tu cuenta
        se cambió el <strong class="tf-ink" style="color:#23201B;" th:text="${date}">1 de enero de 2026, 10:00 a. m.</strong>
        Por seguridad, cerramos las demás sesiones abiertas.
    </p>
    <div th:replace="~{email/parts :: notYou(${link}, 'Recupera el acceso a tu cuenta')}"></div>
</div>
</body>
</html>
