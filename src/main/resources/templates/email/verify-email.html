<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('Verifica tu correo', ~{::content})}">
<body>
<div th:fragment="content" style="font-size:15px;line-height:1.6;">
    <p>Hola <strong th:text="${name}">usuario</strong>,</p>
    <p>Gracias por registrarte en TaskFlow. Confirma tu correo para activar tu cuenta:</p>
    <p style="margin:24px 0;">
        <a th:href="${link}"
           style="background-color:#3f76ff;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">
            Verificar mi correo
        </a>
    </p>
    <p style="color:#6b7280;font-size:13px;">
        El enlace vence en <span th:text="${hours}">24</span> horas. Si no creaste esta cuenta, ignora este correo.
    </p>
</div>
</body>
</html>
