<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout(#{verify.meta}, #{verify.preheader}, ~{::content})}">
<body>
<div th:fragment="content">
    <div th:replace="~{email/parts :: heading('@', 'accent', #{verify.title})}"></div>
    <p class="tf-muted" style="margin:12px 0 0;color:#67615A;">
        <th:block th:text="#{greeting}">Hola</th:block> <strong class="tf-ink" style="color:#23201B;" th:text="${name}">Ana</strong><th:block th:text="#{verify.intro}">, gracias por registrarte.
        Confirma tu correo para activar tu cuenta.</th:block>
    </p>

    <!--/* Mismo progreso que la pantalla de verificación: aquí falta el correo y el workspace */-->
    <table role="presentation" aria-label="Progreso" th:aria-label="#{verify.progress}" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="margin-top:22px;font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;">
        <tr>
            <td width="33%" valign="top" style="padding-right:4px;">
                <div class="tf-bar-ok" style="height:4px;line-height:4px;font-size:0;background-color:#2E9E6A;border-radius:999px;">&nbsp;</div>
                <div class="tf-ink" style="margin-top:6px;color:#23201B;" th:text="|✓ #{verify.step.account}|">✓ cuenta</div>
            </td>
            <td width="33%" valign="top" style="padding:0 2px;">
                <div class="tf-bar" style="height:4px;line-height:4px;font-size:0;background-color:#EAE7E1;border-radius:999px;">&nbsp;</div>
                <div class="tf-muted" style="margin-top:6px;color:#67615A;" th:text="|○ #{verify.step.email}|">○ correo</div>
            </td>
            <td width="33%" valign="top" style="padding-left:4px;">
                <div class="tf-bar" style="height:4px;line-height:4px;font-size:0;background-color:#EAE7E1;border-radius:999px;">&nbsp;</div>
                <div class="tf-muted" style="margin-top:6px;color:#67615A;" th:text="|○ #{verify.step.workspace}|">○ workspace</div>
            </td>
        </tr>
    </table>

    <div th:replace="~{email/parts :: button(${link}, #{verify.button}, #{verify.expires(${hours})})}"></div>
    <div th:replace="~{email/parts :: footnote(#{verify.footnote}, ${link})}"></div>
</div>
</body>
</html>
