<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es"
      th:replace="~{email/layout :: layout('Te invitaron a un workspace', ~{::content})}">
<body>
<div th:fragment="content" style="font-size:15px;line-height:1.6;">
    <p>
        <strong th:text="${inviter}">Ana</strong> te invitó a unirte al workspace
        <strong th:text="${workspace}">Mi equipo</strong> en TaskFlow.
    </p>
    <p style="margin:24px 0;">
        <a th:href="${link}"
           style="background-color:#3f76ff;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;display:inline-block;">
            Ver invitación
        </a>
    </p>
    <p style="color:#6b7280;font-size:13px;">
        Si aún no tienes cuenta, regístrate con este mismo correo para poder aceptarla.
        La invitación vence en <span th:text="${days}">7</span> días.
    </p>
</div>
</body>
</html>
