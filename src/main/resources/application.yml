spring:
  application:
    name: taskflow-backend
  config:
    # Carga las variables del archivo .env (si existe) para el entorno local
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # Las tablas las crea Flyway
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  thymeleaf:
    check-template-location: false
  # Solo se usa con MAIL_PROVIDER=smtp (Mailpit en local, o Brevo/Gmail)
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
  data:
    web:
      pageable:
        max-page-size: 200

server:
  port: 8080
  error:
    include-message: never
  # none (por defecto): la IP del cliente es la de la conexión. Detrás de un proxy (Dokploy/Traefik) usar native: Tomcat
  # toma la IP real de X-Forwarded-For solo si la conexión viene de una red interna (el proxy), así nadie la falsea.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

springdoc:
  # El frontend genera sus tipos con /v3/api-docs; en producción se puede apagar con SPRINGDOC_ENABLED=false
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: 15
    refresh-expiration-days: 7
  mail:
    # resend (API de Resend, producción) | smtp (Mailpit en local, Brevo, Gmail…)
    provider: ${MAIL_PROVIDER:resend}
    resend-api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:TaskFlow <onboarding@resend.dev>}
    # Escribir en el log los enlaces (secretos) de los correos que no salen. Vacío: solo si FRONTEND_URL es localhost
    log-links: ${MAIL_LOG_LINKS:}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  # Zona horaria usada para mostrar fechas en los correos
  timezone: America/Bogota
  # Limpieza diaria de tokens vencidos y notificaciones leídas antiguas (MaintenanceJobs)
  maintenance:
    cron: ${MAINTENANCE_CRON:0 30 3 * * *}
    notification-retention-days: ${NOTIFICATION_RETENTION_DAYS:90}
  tokens:
    email-verification-hours: 24
    password-reset-minutes: 60
    invitation-days: 7
