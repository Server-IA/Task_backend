services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bandeja de correo falsa para desarrollo: todo lo que envía la API (con MAIL_PROVIDER=smtp)
  # aparece en http://localhost:8025 sin salir a internet.
  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: taskflow-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Bandeja web

volumes:
  pgdata:
